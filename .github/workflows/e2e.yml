name: E2E Tests

# E2E WORKFLOW STATUS: DISABLED IN CI
# 
# This workflow is separate from the release certification gate.
# E2E tests validate client-side functionality in a browser environment against a
# fully provisioned WordPress + marketplace backend.
#
# Currently disabled because:
# - E2E tests require external network access to https://godemarsempire.com
# - GitHub Actions CI has no network access to external production URLs
# - Test environment (marketplace data, WooCommerce, etc.) not provisioned in CI
#
# For release certification, see release-certification.yml which runs PHPUnit against
# a disposable local WordPress + MySQL environment.
#
# To re-enable E2E in CI:
# 1. Refactor test to use environment variable for base URL
# 2. Provision a local WordPress + WooCommerce + plugin instance in the workflow
# 3. Populate marketplace test fixtures
# 4. Update Playwright config to use CI endpoint
#
# For local E2E testing: run 'npm test --prefix e2e' with PLAYWRIGHT_BASE_URL set

on:
  # Workflow disabled in CI - use only for manual/local testing
  workflow_dispatch:

jobs:
  playwright-e2e-manual:
    name: Manual E2E Tests (Local Only)
    if: false  # Explicitly disabled until CI environment is provisioned
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --prefix e2e

      - name: Install Playwright browsers
        run: npx --yes playwright install --with-deps

      - name: Run E2E tests
        run: npm test --prefix e2e
