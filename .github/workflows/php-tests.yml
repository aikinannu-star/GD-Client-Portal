name: WordPress Integration Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / WordPress ${{ matrix.wordpress }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
        wordpress: ["6.6", "latest"]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wp_test
          MYSQL_PASSWORD: wp_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress
      WP_DB_NAME: wordpress_test
      WP_DB_USER: wp_test
      WP_DB_PASSWORD: wp_test
      WP_DB_HOST: 127.0.0.1:3306

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2,svn

      - name: Install Composer dependencies
        working-directory: gd-client-portal
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate PHP syntax
        working-directory: gd-client-portal
        run: composer run test:syntax

      - name: Run standalone regression contracts
        working-directory: gd-client-portal
        run: |
          chmod +x tests/run-standalone-regressions.sh
          tests/run-standalone-regressions.sh

      - name: Wait for MySQL
        run: |
          for i in {1..40}; do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent && exit 0
            sleep 2
          done
          echo "MySQL did not become ready."
          exit 1

      - name: Install WordPress core and test suite
        working-directory: gd-client-portal
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          chmod +x bin/install-wp-tests.sh
          bin/install-wp-tests.sh "$WP_DB_NAME" "$WP_DB_USER" "$WP_DB_PASSWORD" "$WP_DB_HOST" "$WP_VERSION"

      - name: Verify test environment
        run: |
          test -f "$WP_TESTS_DIR/includes/functions.php"
          test -f "$WP_TESTS_DIR/includes/bootstrap.php"
          test -f "$WP_TESTS_DIR/wp-tests-config.php"
          test -d "$WP_CORE_DIR"

      - name: Run PHPUnit
        working-directory: gd-client-portal
        run: |
          set -o pipefail
          vendor/bin/phpunit -c phpunit.xml.dist --testdox | tee ../phpunit-results-php${{ matrix.php }}-wp${{ matrix.wordpress }}.txt

      - name: Enforce PHPUnit success summary
        run: |
          grep -Eq 'OK \(|Tests: [0-9]+' phpunit-results-php${{ matrix.php }}-wp${{ matrix.wordpress }}.txt

      - name: Upload PHPUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-results-php${{ matrix.php }}-wp${{ matrix.wordpress }}
          path: phpunit-results-php${{ matrix.php }}-wp${{ matrix.wordpress }}.txt
          if-no-files-found: ignore
