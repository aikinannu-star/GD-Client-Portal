name: WordPress Integration Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / WordPress ${{ matrix.wordpress }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
        wordpress: ["6.6", "latest"]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wp_test
          MYSQL_PASSWORD: wp_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress
      WP_DB_NAME: wordpress_test
      WP_DB_USER: wp_test
      WP_DB_PASSWORD: wp_test
      WP_DB_HOST: 127.0.0.1:3306

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Install Composer dependencies
        working-directory: gd-client-portal
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate PHP syntax
        working-directory: gd-client-portal
        run: composer run test:syntax

      - name: Run standalone regression contracts
        working-directory: gd-client-portal
        run: |
          chmod +x tests/run-standalone-regressions.sh
          tests/run-standalone-regressions.sh

      - name: Wait for MySQL
        run: |
          for i in {1..40}; do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent && exit 0
            sleep 2
          done
          echo "MySQL did not become ready."
          exit 1

      - name: Verify MySQL database
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "SELECT 1;" || exit 1
          echo "MySQL is ready and accessible"

      - name: Install WordPress core and test suite
        working-directory: gd-client-portal
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          chmod +x bin/install-wp-tests.sh
          set -o pipefail
          bin/install-wp-tests.sh "$WP_DB_NAME" "$WP_DB_USER" "$WP_DB_PASSWORD" "$WP_DB_HOST" "$WP_VERSION" 2>&1 | tee /tmp/wp-install.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "WordPress install failed. Log:"
            cat /tmp/wp-install.log
            exit 1
          fi

      - name: Inspect generated WordPress test configuration
        working-directory: gd-client-portal
        env:
          WP_DB_NAME: ${{ env.WP_DB_NAME }}
          WP_DB_USER: ${{ env.WP_DB_USER }}
          WP_DB_PASSWORD: ${{ env.WP_DB_PASSWORD }}
          WP_DB_HOST: ${{ env.WP_DB_HOST }}
        run: |
          echo "=== wp-tests-config.php database configuration (without password) ==="
          # Show key config lines except password
          grep -nE "ABSPATH|dbhost|dbname|dbuser|table_prefix" "$WP_TESTS_DIR/wp-tests-config.php" || true
          echo "=== dbpass (redacted) ==="
          grep -nE "dbpass" "$WP_TESTS_DIR/wp-tests-config.php" | sed -E "s/(dbpass'\\s*=>\\s*)(['\"]).+\\2/\1'REDACTED'/" || true

          echo "=== Database connectivity ==="
          mysql -h 127.0.0.1 -P 3306 -u "$WP_DB_USER" -p"$WP_DB_PASSWORD" -e "SELECT DATABASE(), USER(), @@hostname, @@port;" "$WP_DB_NAME" || true

      - name: Inspect WordPress core files and install log
        working-directory: gd-client-portal
        run: |
          echo "=== WP core dir: $WP_CORE_DIR ==="
          ls -la "$WP_CORE_DIR" || true
          echo "=== WP wp-includes dir ==="
          ls -la "$WP_CORE_DIR/wp-includes" || true
          echo "=== Tail of /tmp/wp-install.log (if present) ==="
          if [ -f /tmp/wp-install.log ]; then
            tail -n 200 /tmp/wp-install.log || true
          else
            echo "/tmp/wp-install.log not found"
          fi

      - name: Verify test environment
        run: |
          test -f "$WP_TESTS_DIR/includes/functions.php"
          test -f "$WP_TESTS_DIR/includes/bootstrap.php"
          test -f "$WP_TESTS_DIR/wp-tests-config.php"
          test -d "$WP_CORE_DIR"

      - name: Run PHPUnit
        working-directory: gd-client-portal
        run: |
          set -o pipefail
          vendor/bin/phpunit -c phpunit.xml.dist --testdox | tee ../phpunit-results-php${{ matrix.php }}-wp${{ matrix.wordpress }}.txt

      - name: Enforce PHPUnit success summary
        run: |
          grep -Eq 'OK \(|Tests: [0-9]+' phpunit-results-php${{ matrix.php }}-wp${{ matrix.wordpress }}.txt

      - name: Upload PHPUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-results-php${{ matrix.php }}-wp${{ matrix.wordpress }}
          path: phpunit-results-php${{ matrix.php }}-wp${{ matrix.wordpress }}.txt
          if-no-files-found: ignore
