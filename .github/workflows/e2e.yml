name: E2E Tests

# This workflow is separate from the release certification gate.
# E2E tests validate client-side functionality in a browser environment.
# For release certification, see release-certification.yml which runs PHPUnit.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  playwright-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --prefix e2e

      - name: Install Playwright browsers
        run: npx --yes playwright install --with-deps

      - name: Run E2E tests
        run: npm test --prefix e2e
